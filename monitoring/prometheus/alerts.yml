groups:
  - name: aegiscloud
    rules:
      - alert: BackendDown
        expr: up{job="aegiscloud-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AegisCloud backend is not responding to Prometheus scrapes"

      - alert: CriticalVulnerabilitiesPresent
        expr: aegis_vulnerabilities{severity="critical"} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Latest scans contain critical vulnerabilities"

      - alert: OpenAlertBacklog
        expr: aegis_open_alerts > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "More than 5 runtime alerts are waiting for acknowledgement"

      - alert: HighApiLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(aegis_http_request_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile API latency is above 1 second"