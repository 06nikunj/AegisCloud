services:
  mongo:
    image: mongo:7
    container_name: aegiscloud-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    container_name: aegiscloud-backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      - mongo
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: aegiscloud-frontend
    restart: unless-stopped
    environment:
      - VITE_API_PROXY=http://backend:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  mongo_data: